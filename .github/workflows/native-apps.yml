name: Native apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

jobs:
  desktop:
    name: Electron (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            command: package:win
            artifacts: packages/app-electron/release/*.exe
          - name: macOS
            runner: macos-26
            command: package:mac
            artifacts: |
              packages/app-electron/release/*.dmg
              packages/app-electron/release/*.zip
          - name: Linux
            runner: ubuntu-24.04
            command: package:linux
            artifacts: |
              packages/app-electron/release/*.AppImage
              packages/app-electron/release/*.deb
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cinaseek/app-electron ${{ matrix.command }}
      - name: Smoke test packaged Windows app
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $appPath = Resolve-Path 'packages/app-electron/release/win-unpacked/CinaSeek.exe'
          $appProcess = Start-Process -FilePath $appPath -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($appProcess.HasExited) {
              throw "Packaged application exited during startup with code $($appProcess.ExitCode)."
            }
          } finally {
            if (-not $appProcess.HasExited) {
              Stop-Process -Id $appProcess.Id
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: cinaseek-release-electron-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cinaseek/app-mobile sync
      - run: pnpm --filter @cinaseek/app-mobile assets
      - run: chmod +x packages/app-mobile/android/gradlew
      - run: pnpm --filter @cinaseek/app-mobile build:android:debug
      - name: Stage versioned APK
        run: |
          version=$(node -p "require('./packages/app-mobile/package.json').version")
          cp packages/app-mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            "packages/app-mobile/android/app/build/outputs/apk/debug/CinaSeek-${version}-android-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: cinaseek-release-android
          path: packages/app-mobile/android/app/build/outputs/apk/debug/CinaSeek-*-android-debug.apk
          if-no-files-found: error

  ios:
    name: iOS Simulator app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cinaseek/app-mobile sync
      - run: pnpm --filter @cinaseek/app-mobile assets
      - name: Build unsigned Simulator app
        run: >-
          xcodebuild
          -project packages/app-mobile/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath packages/app-mobile/ios/build
          CODE_SIGNING_ALLOWED=NO
      - name: Stage versioned Simulator bundle
        run: |
          version=$(node -p "require('./packages/app-mobile/package.json').version")
          ditto -c -k --sequesterRsrc --keepParent \
            packages/app-mobile/ios/build/Build/Products/Debug-iphonesimulator/App.app \
            "packages/app-mobile/ios/build/CinaSeek-${version}-ios-simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: cinaseek-release-ios-simulator
          path: packages/app-mobile/ios/build/CinaSeek-*-ios-simulator.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cinaseek-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify tag and package versions
        run: |
          desktop_version=$(node -p "require('./packages/app-electron/package.json').version")
          mobile_version=$(node -p "require('./packages/app-mobile/package.json').version")
          test "$desktop_version" = "$mobile_version"
          test "$GITHUB_REF_NAME" = "app-v${desktop_version}"
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "CinaSeek Apps v${version}" \
            --notes-file .github/native-release-notes.md
